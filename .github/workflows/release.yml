name: Release Summer CLI

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Record version for ldflags
        run: echo "LDFLAGS_VERSION=$(echo "${GITHUB_REF_NAME#v}" | grep . || echo 0.0.0-dev)" >> "$GITHUB_ENV"

      - name: Run Tests
        run: go test -v ./...

      - name: Build for Linux (amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s -X github.com/dropguard/summer-cli/cmd.Version=${{ env.LDFLAGS_VERSION }} -X github.com/dropguard/summer-cli/cmd.FrameworkVersion=${{ env.LDFLAGS_VERSION }}" -o summer-linux-amd64

      - name: Build for Linux (arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-w -s -X github.com/dropguard/summer-cli/cmd.Version=${{ env.LDFLAGS_VERSION }} -X github.com/dropguard/summer-cli/cmd.FrameworkVersion=${{ env.LDFLAGS_VERSION }}" -o summer-linux-arm64

      - name: Build for macOS (amd64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-w -s -X github.com/dropguard/summer-cli/cmd.Version=${{ env.LDFLAGS_VERSION }} -X github.com/dropguard/summer-cli/cmd.FrameworkVersion=${{ env.LDFLAGS_VERSION }}" -o summer-darwin-amd64

      - name: Build for macOS (arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-w -s -X github.com/dropguard/summer-cli/cmd.Version=${{ env.LDFLAGS_VERSION }} -X github.com/dropguard/summer-cli/cmd.FrameworkVersion=${{ env.LDFLAGS_VERSION }}" -o summer-darwin-arm64

      - name: Build for Windows (amd64)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-w -s -X github.com/dropguard/summer-cli/cmd.Version=${{ env.LDFLAGS_VERSION }} -X github.com/dropguard/summer-cli/cmd.FrameworkVersion=${{ env.LDFLAGS_VERSION }}" -o summer-windows-amd64.exe

      - name: Generate checksums
        run: |
          sha256sum summer-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            SHA256SUMS
            summer-linux-amd64
            summer-linux-arm64
            summer-darwin-amd64
            summer-darwin-arm64
            summer-windows-amd64.exe
          generate_release_notes: true
