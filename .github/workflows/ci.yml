name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          # The e2e test runs `summer build` on a scaffolded app, which resolves the framework
          # and plugins into ~/.m2. Key on what decides those dependencies: the scaffold pom
          # and the framework version this CLI pins.
          cache: maven
          cache-dependency-path: |
            templates/scaffold/pom.xml
            cmd/framework_version.go

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

      - name: Check go.mod is tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff

      - name: Vet (every release target)
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...

      - name: Run Tests
        run: go test ./...
